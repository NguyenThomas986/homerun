[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homerun"
version = "1.0.0"
description = "CSV-free csRNA-seq pipeline (trim → STAR → tag dirs → bedGraphs → TSS → QC → stability)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Thomas Nguyen" }]
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "reportlab>=4.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["rna-seq", "csrna-seq", "slurm", "hpc", "bioinformatics", "pipeline", "transcription-initiation"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
 
 
[project.scripts]
homerun = "homerun.pipeline:main"

[tool.setuptools.packages.find]
include = ["homerun*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that are slower than the typical fast unit test (still no external tools/network).",
]


[project.urls]
Homepage = "https://thomasmnguyen.dev/homerun/"
Repository = "https://github.com/NguyenThomas986/homerun"
Issues = "https://github.com/NguyenThomas986/homerun/issues"