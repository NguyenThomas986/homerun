[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homerun"
version = "1.0.0"
description = "CSV-free csRNA-seq pipeline (trim → STAR → tag dirs → bedGraphs → TSS → QC → stability)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Thomas Nguyen" }]
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "reportlab>=4.0"
]

[project.scripts]
homerun = "homerun.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
