site_name: HOMERun
site_url: https://thomasmnguyen.dev/homerun/
site_description: A SLURM-oriented csRNA-seq analysis pipeline
repo_url: https://github.com/NguyenThomas986/homerun
repo_name: NguyenThomas986/homerun
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  logo: assets/images/duttke_lab_logo.svg
  favicon: assets/images/duttke_lab_logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
      primary: green
      accent: deep purple

    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
      primary: blue
      accent: deep orange

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quickstart.md
  - Usage:
      - CLI Reference: cli.md
      - Input Files: input-files.md
      - Configuration: configuration.md
      - Pipeline: pipeline.md
      - SLURM: slurm.md
  - QC & Reports:
      - Quality Control: qc.md
      - Reports: reports.md
  - Help:
      - Report an Issue: issue.md
  - Development:
      - Testing: testing.md
      - Contributing: contributing.md
    

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  announcement: "HOMERun is in alpha — interfaces and output names may still change."

copyright: 'HOMERun · <a href="https://labs.wsu.edu/duttke/">Duttke Lab</a> · Washington State University'
